[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:apache2]
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; export FAKETIME="${FAKETIME:-}"; exec /usr/sbin/apache2ctl -D FOREGROUND'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:postgresql]
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; export FAKETIME="${FAKETIME:-}"; exec su -p -c "/usr/lib/postgresql/8.4/bin/postgres -D /var/lib/postgresql/8.4/main -c config_file=/etc/postgresql/8.4/main/postgresql.conf" postgres'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:proftpd]
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; export FAKETIME="${FAKETIME:-}"; exec /usr/sbin/proftpd -n'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
