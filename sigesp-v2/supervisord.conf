[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:apache2]
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; FT="${FAKETIME:-}"; case "$FT" in ""|@*|+*|-*|%%*) : ;; [0-9][0-9][0-9][0-9]-*) FT="@$FT" ;; esac; export FAKETIME="$FT"; export FAKETIME_DONT_RESET=1; export FAKETIME_DONT_FAKE_MONOTONIC=1; exec /usr/sbin/apache2ctl -D FOREGROUND'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:postgresql]
user=postgres
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; FT="${FAKETIME:-}"; case "$FT" in ""|@*|+*|-*|%%*) : ;; [0-9][0-9][0-9][0-9]-*) FT="@$FT" ;; esac; export FAKETIME="$FT"; export FAKETIME_DONT_RESET=1; export FAKETIME_DONT_FAKE_MONOTONIC=1; exec /usr/lib/postgresql/8.4/bin/postgres -D /var/lib/postgresql/8.4/main -c config_file=/etc/postgresql/8.4/main/postgresql.conf'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:proftpd]
command=/bin/sh -lc 'export LD_PRELOAD="/usr/local/lib/faketime/libfaketime.so.1"; FT="${FAKETIME:-}"; case "$FT" in ""|@*|+*|-*|%%*) : ;; [0-9][0-9][0-9][0-9]-*) FT="@$FT" ;; esac; export FAKETIME="$FT"; export FAKETIME_DONT_RESET=1; export FAKETIME_DONT_FAKE_MONOTONIC=1; exec /usr/sbin/proftpd -n'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
