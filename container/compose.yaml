name: sigesp-v2-temp
services:
  faketime-api:
    build:
      context: ..
      dockerfile: container/api/Dockerfile
    container_name: sigesp-faketime-api
    volumes:
      - ./faketime/current.rc:/app/container/faketime/current.rc:z
      - sigesp-faketime-api-data:/app/service_data
    ports:
      - "${FAKETIME_API_BIND_PORT:-8789}:8080"
    environment:
      FAKETIME_API_HOST: 0.0.0.0
      FAKETIME_API_PORT: 8080
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sigesp-php-v2-temp
    volumes:
      - ../src:/var/www/html:z
      - ./faketime/current.rc:/var/lib/faketime/current.rc:z
    ports:
      - "8003:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
      - FAKETIME_TIMESTAMP_FILE=/var/lib/faketime/current.rc
      - FAKETIME_NO_CACHE=1
      - LANG=es_VE.iso885915
      - LC_ALL=es_VE.iso885915
      - LC_CTYPE=es_VE.iso885915
    env_file:
      - path: ../.env
        required: false

  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: sigesp-postgres-v2-temp
    command: postgres -c log_statement=${POSTGRES_LOG_STATEMENT:-all}
    volumes:
      - sigesp-data-v2-1:/var/lib/postgresql/data
      - ./faketime/current.rc:/var/lib/faketime/current.rc:z
    ports:
      - "6003:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # Argumentos para initdb: establecer encoding LATIN9 y la locale generada en la imagen
      POSTGRES_INITDB_ARGS: "--encoding=LATIN9 --locale=es_VE.ISO-8859-15"
      # Ajustar variables de entorno para que coincidan con la locale usada por initdb
      LANG: es_VE.ISO-8859-15
      LC_ALL: es_VE.ISO-8859-15
      # TZ will be loaded from env_file
      # Path check inside Debian Stretch/Bookworm usually:
      LD_PRELOAD: /usr/local/lib/faketime/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /var/lib/faketime/current.rc
      FAKETIME_NO_CACHE: "1"
    healthcheck:
      test: ["CMD-SHELL", "su -s /bin/sh postgres -c \"psql -tAc 'SELECT 1'\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    env_file:
      - path: ../.env
        required: false

  pgagent:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: sigesp-pgagent-v2-temp
    command: >
      bash -c "psql -h postgres -U postgres -d postgres -c 'CREATE EXTENSION IF NOT EXISTS pgagent;' && pgagent -f -l 1 'host=postgres user=postgres dbname=postgres'"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: postgres
      PGHOST: postgres
    env_file:
      - path: ../.env
        required: false

  pgadmin:
    image: dpage/pgadmin4:6.12
    container_name: sigesp-pgadmin-v2-temp
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sigesp-faketime-api-data:
  sigesp-data-v2-1:
